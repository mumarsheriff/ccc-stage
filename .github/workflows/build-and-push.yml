name: Build and Push Monitoring Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Login
        run: |
          echo "Docker User: ${{ secrets.DOCKER_USERNAME }}"
          docker info

      - name: Build and Push Prometheus
        uses: docker/build-push-action@v5
        with:
          context: ./prometheus
          push: true
          tags: sheriffdocker89/monitoring:prometheus

      - name: Build and Push Grafana
        uses: docker/build-push-action@v5
        with:
          context: ./grafana
          push: true
          tags: sheriffdocker89/monitoring:grafana
