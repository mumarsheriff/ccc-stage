name: Build and Push Monitoring Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Prometheus
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/prometheus:latest ./prometheus

      - name: Push Prometheus
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/prometheus:latest

      - name: Build Grafana
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/grafana:latest ./grafana

      - name: Push Grafana
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/grafana:latest
